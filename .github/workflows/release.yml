name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # RELEASE ORDERING INVARIANT (rationale repeated at each relevant step):
      # publishing to NuGet.org is the single IRREVERSIBLE step, so it is the pivot.
      # Everything before it is cheap and reversible (build/test/pack, plus a LOCAL
      # commit+tag that is not yet pushed); everything after it (push the commit+tag
      # to main, create the GitHub Release) is reversible/recreatable and is made
      # idempotent + retried. A failure before NuGet accepts the package leaves no
      # remote or registry trace and may be re-run. Once NuGet accepts the package,
      # never re-run or rebuild this release, even if the tag push failed: recover
      # only from this run's immutable release-recovery-vX.Y.Z artifact.
      #
      # The "Push the release commit + tag" step pushes straight to main. If you
      # protect main with a rule that requires pull requests or status checks, that
      # push is rejected unless the pusher can bypass it. This workflow mints a
      # short-lived GitHub App token (repo variable RELEASE_APP_ID + secret
      # RELEASE_APP_PRIVATE_KEY) and checks out with it, so the push runs as the App
      # — add that App to the ruleset's bypass list. Until it is configured the
      # checkout falls back to GITHUB_TOKEN (fine while main is unprotected). Recipe:
      # release-token-bypass.md.
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.

      # We always release from main. workflow_dispatch still shows GitHub's
      # "Use workflow from" ref picker (it cannot be hidden), so reject any
      # dispatch from a non-main ref up front: otherwise that branch's copy of
      # this workflow file would run — against main, which the checkout below
      # hard-pins — producing a confusing mismatch. Fail fast before any work.
      - name: Guard — release only from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main (got: $RELEASE_REF). Re-run with 'Use workflow from: main'."
            exit 1
          fi
          echo "Dispatched from main."

      - name: Preflight — required secrets present before any external action
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # Fail fast, before any irreversible publish or VCS push, if the publish
          # credential is missing — otherwise a missing secret only surfaces at the
          # publish step, after the cheap work has run. If you switch to NuGet
          # Trusted Publishing (OIDC, see the publish step below), drop the
          # NUGET_API_KEY check here and verify id-token availability instead.
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "::error::NUGET_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions before releasing."
            exit 1
          fi
          echo "Required secrets present."

      # Mint a short-lived GitHub App installation token. Pushing the release commit
      # to `main` with it makes the **App** the actor — and the App sits in the
      # branch-protection ruleset's bypass list, so the push is allowed. The default
      # `github-actions[bot]` CANNOT be granted a ruleset bypass (it's a system actor,
      # not an App), and a PAT would expire; an App token is short-lived, auto-revoked,
      # and needs no rotation. Configure repo variable `RELEASE_APP_ID` + secret
      # `RELEASE_APP_PRIVATE_KEY`; until then this step is skipped and the push falls
      # back to the default `GITHUB_TOKEN` (fine while `main` is unprotected). See the
      # release-token-bypass.md recipe.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: main
          fetch-depth: 0
          # Persist the App token so the later `git push` to `main` runs as the App
          # (and thus uses its ruleset bypass). Empty when the App isn't configured →
          # fall back to the default token.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG=""
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              LATEST_TAG="$TAG"
              break
            fi
          done < <(git tag --merged HEAD --sort=-v:refname)
          if [[ -n "$LATEST_TAG" ]]; then
            CURRENT="${LATEST_TAG#v}"
            if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not parse current version from tag (got: '$CURRENT')"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) NEW="$((MAJOR+1)).0.0" ;;
              minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            echo "Latest release tag: $LATEST_TAG (current=$CURRENT); ${{ inputs.bump }} bump -> $NEW"
          else
            # First release: take the seed version straight from the .fsproj <Version>
            # so the published version matches what the repo declares, instead of an
            # implicit 0.0.1 from applying the bump input. The bump input is ignored.
            CURRENT=""
            NEW=$(grep -oP '(?<=<Version>)[^<]+' src/__ProjectName__/__ProjectName__.fsproj | head -n1)
            echo "No release tags found; seeding first release from .fsproj <Version>=$NEW (bump input ignored)."
          fi
          if [[ ! "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Computed version '$NEW' is not a valid MAJOR.MINOR.PATCH semver."
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # Keep retries on the same source tree deterministic. The release commit
      # contains only generated version/changelog changes, so anchoring its dates
      # to the source commit makes an unchanged main reproduce the same commit
      # SHA; a moved main still produces a different identity and is rejected by
      # the package verifier below.
      - name: Capture release source identity
        id: release-source
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit-date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2
        with:
          tool: git-cliff@2

      - name: Auto-fill [Unreleased] from git log if empty
        env:
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          prev_tag = os.environ["PREV_TAG"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not m:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          body = m.group(1)
          has_real_bullets = any(re.match(r"^-\s+\S", ln) for ln in body.splitlines())
          if has_real_bullets:
              print("[Unreleased] already has manual entries; skipping auto-fill.")
              sys.exit(0)

          command = ["git-cliff", "--config", "cliff.toml", "--strip", "all"]
          if prev_tag:
              command.append(f"{prev_tag}..HEAD")
              print(f"[Unreleased] is empty; generating from git log since {prev_tag}...")
          else:
              print("[Unreleased] is empty; generating from the full git history for the first release...")
          result = subprocess.run(
              command,
              check=True,
              capture_output=True,
              text=True,
          )
          generated = result.stdout.strip()
          if not generated:
              range_description = f" between {prev_tag} and HEAD" if prev_tag else ""
              print(
                  f"::error::No release-worthy commits found{range_description}. "
                  "Either add a manual entry to [Unreleased] in CHANGELOG.md, or commit "
                  "changes with a recognised prefix (Add/Fix/Refactor/Update/Remove/...).",
                  file=sys.stderr,
              )
              sys.exit(1)

          new_text = text[: m.start(1)] + generated + "\n\n" + text[m.end(1) :]
          path.write_text(new_text)
          print("----- auto-generated [Unreleased] body -----")
          print(generated)
          print("--------------------------------------------")
          PY

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = (m.group(1) if m else "").strip()

          # Keep "### Header" only if it has at least one real bullet ("- text").
          # Drop placeholder "-" lines and empty sections so notes are clean.
          parts = re.split(r"(?m)(^### .+$)", body)
          out = []
          for i in range(1, len(parts), 2):
              header = parts[i]
              section = parts[i + 1] if i + 1 < len(parts) else ""
              bullets = [ln for ln in section.splitlines() if re.match(r"^-\s+\S", ln)]
              if bullets:
                  if out:
                      out.append("")
                  out.append(header)
                  out.extend(bullets)

          result = "\n".join(out).strip()
          if not result:
              print(
                  "::error::[Unreleased] section in CHANGELOG.md is empty. "
                  "Add release notes before releasing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          pathlib.Path("release-notes.md").write_text(result + "\n")
          print("----- release-notes.md -----")
          print(result)
          print("----------------------------")
          PY

      - name: Bump version in fsproj
        run: sed -i -E "s|<Version>[^<]+</Version>|<Version>${{ steps.version.outputs.version }}</Version>|" src/__ProjectName__/__ProjectName__.fsproj

      - name: Promote Unreleased section in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
          RELEASE_DATE: ${{ steps.release-source.outputs.date }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          prev_tag = os.environ["PREV_TAG"]
          date = os.environ["RELEASE_DATE"]
          repo = "https://github.com/__GitHubOwner__/__ProjectName__"

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          new_unreleased = (
              "## [Unreleased]\n\n"
              "### Added\n-\n\n"
              "### Changed\n-\n\n"
              "### Fixed\n-\n\n"
              f"## [{version}] - {date}"
          )
          text, n = re.subn(r"^## \[Unreleased\]$", new_unreleased, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          version_link = (
              f"[{version}]: {repo}/compare/{prev_tag}...{tag}"
              if prev_tag
              else f"[{version}]: {repo}/releases/tag/{tag}"
          )
          link_replacement = f"[Unreleased]: {repo}/compare/{tag}...HEAD\n{version_link}"
          text, n = re.subn(r"^\[Unreleased\]:.*$", link_replacement, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '[Unreleased]: ...' reference link in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          path.write_text(text)
          PY

      # Create the release commit and tag locally, but do NOT push yet. The local
      # identity is part of the package metadata and recovery bundle; only the VCS
      # push and GitHub Release remain after NuGet accepts the package.
      - name: Commit and tag the release (local only)
        id: release-identity
        run: |
          set -euo pipefail
          git config user.name "__Author__"
          git config user.email "__AuthorEmail__"
          export GIT_AUTHOR_DATE="${{ steps.release-source.outputs.commit-date }}"
          export GIT_COMMITTER_DATE="${{ steps.release-source.outputs.commit-date }}"
          git add src/__ProjectName__/__ProjectName__.fsproj CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keep the exact local release commit/tag available for post-pivot recovery.
      - name: Create local release recovery bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          git bundle create ./artifacts/release-recovery.bundle HEAD "$TAG"
          git bundle verify ./artifacts/release-recovery.bundle

      # Build from the exact local release commit. SourceLink writes this commit
      # into the package metadata; retries can therefore reject a package made
      # from a moved main branch instead of trusting --skip-duplicate.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/__ProjectName__/__ProjectName__.fsproj --no-build --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.version }} /p:PackageReleaseNotesFile=release-notes.md

      # The package must carry the same finalized changelog that was committed
      # and tagged above. Fail before checksums or the NuGet pivot if pack ever
      # reads a stale tree or drops the root release-state file.
      - name: Verify packed final CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import zipfile

          packages = sorted(pathlib.Path("artifacts").glob("*.nupkg"))
          if len(packages) != 1:
              raise SystemExit(f"Expected exactly one package, found {len(packages)}.")

          expected = pathlib.Path("CHANGELOG.md").read_bytes()
          version = os.environ["VERSION"]
          if f"## [{version}] - ".encode() not in expected:
              raise SystemExit(f"Final CHANGELOG.md is missing release section [{version}].")

          with zipfile.ZipFile(packages[0]) as archive:
              try:
                  packed = archive.read("CHANGELOG.md")
              except KeyError as error:
                  raise SystemExit("Package does not contain root CHANGELOG.md.") from error

          if packed != expected:
              raise SystemExit("Packed CHANGELOG.md differs from the finalized working-tree file.")
          print(f"Verified finalized CHANGELOG.md in {packages[0]}.")
          PY

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd ./artifacts
          files=(*.nupkg *.snupkg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No package files to hash in ./artifacts."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # A version-scoped duplicate is not proof that this run produced the same
      # package. The verifier compares canonical package contents and its
      # embedded repository commit. A moved main, occupied version, registry
      # lookup failure, or different package fails before any VCS/GitHub write.
      - name: Verify existing NuGet package identity
        id: package-identity
        env:
          PACKAGE_ID: __ProjectName__
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release-identity.outputs.commit }}
        run: |
          set -euo pipefail
          package=$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print -quit)
          if [[ -z "$package" ]]; then
            echo "::error::No .nupkg found in ./artifacts."
            exit 1
          fi
          python3 scripts/verify-nuget-package.py \
            --package "$package" \
            --package-id "$PACKAGE_ID" \
            --version "$VERSION" \
            --expected-commit "$RELEASE_COMMIT" \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT"

      # === PIVOT: the single irreversible step ===
      # NuGet publishing cannot be undone (a pushed version can only be unlisted,
      # never re-pushed), so it is the pivot and every reversible action is ordered
      # around it. It runs BEFORE the git push and the GitHub Release: if it fails,
      # no tag/commit has reached the remote and no Release exists. A retry is safe
      # only while the verifier proves that the version is absent or that the
      # existing package has identical canonical contents and release commit.
      #
      # MORE SECURE ALTERNATIVE — NuGet Trusted Publishing (OIDC): instead of a
      # long-lived NUGET_API_KEY secret, mint a short-lived key per run. Add
      # `id-token: write` to this job's permissions, configure a trusted publisher
      # policy on nuget.org for this repo+workflow, then replace the step below with
      # the `NuGet/login` action to obtain a temporary key (and update the preflight
      # step accordingly). See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: Push to NuGet.org (irreversible pivot)
        id: nuget_publish
        if: ${{ steps.package-identity.outputs.existing != 'true' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if dotnet nuget push "./artifacts/*.nupkg" \
                 --source "https://api.nuget.org/v3/index.json" \
                 --api-key "$NUGET_API_KEY" \
                 --skip-duplicate; then
              echo "NuGet push succeeded (attempt $attempt)."
              exit 0
            fi
            echo "::warning::NuGet push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 15))
          done
          echo "::error::NuGet push failed after 3 attempts. Acceptance is ambiguous; do not rebuild or re-run this release."
          echo "::error::Use the exact release-recovery-v${{ steps.version.outputs.version }} artifact if a later step must be completed."
          exit 1

      # This second check closes the race between the preflight lookup and the
      # publish. It also makes --skip-duplicate safe: a duplicate is accepted
      # only when the downloaded package still matches this release commit and
      # the canonical contents packed by this run. A mismatch fails before VCS/GitHub work.
      - name: Verify published NuGet package identity
        env:
          PACKAGE_ID: __ProjectName__
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release-identity.outputs.commit }}
        run: |
          set -euo pipefail
          package=$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print -quit)
          python3 scripts/verify-nuget-package.py \
            --package "$package" \
            --package-id "$PACKAGE_ID" \
            --version "$VERSION" \
            --expected-commit "$RELEASE_COMMIT"

      # Reversible VCS write, AFTER the pivot. --atomic guarantees the branch and
      # tag move together (or neither does), so we never advance main while losing
      # the tag. If this fails, the package and canonical release identity are already
      # immutable; recover from the uploaded run artifact instead of rebuilding.
      - name: Push the release commit + tag (atomic)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push --atomic origin HEAD:refs/heads/main "$TAG"; then
              echo "Release commit and tag push succeeded (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Atomic release push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "::error::The package is already published, but the release commit and tag were not pushed."
          echo "::error::Do not rebuild or re-run the whole workflow; use release-recovery-$TAG."
          exit 1

      # Final, recreatable step, made idempotent (edit the Release if it already
      # exists, else create it) and retried. By now the package is published AND the
      # tag is on main, so a blind re-run of the WHOLE workflow would compute the
      # NEXT version and orphan this release — hence the failure message tells the
      # operator to finish by hand rather than re-running.
      - name: Create or update the GitHub Release (idempotent)
        env:
          # Use the App token when configured (consistent with the push above and
          # robust if the org restricts the default GITHUB_TOKEN); fall back to
          # GITHUB_TOKEN otherwise. Creating a Release needs only contents: write,
          # which both identities have.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/*.nupkg ./artifacts/*.snupkg ./artifacts/SHA256SUMS)
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
                 && gh release upload "$TAG" "${assets[@]}" --clobber; then
                echo "Updated existing Release $TAG (attempt $attempt)."
                exit 0
              fi
            else
              if gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${assets[@]}"; then
                echo "Created Release $TAG (attempt $attempt)."
                exit 0
              fi
            fi
            echo "::warning::GitHub Release step attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to create/update the GitHub Release after 3 attempts. The package and tag are already published. Do NOT re-run this workflow; use release-recovery-$TAG to finish by hand."
          exit 1

      # Preserve the exact post-pivot state whenever a later step fails or is
      # cancelled. A new run must never rebuild an already-published version from
      # a moved main branch.
      - name: Preserve exact post-pivot recovery state
        if: >-
          ${{
            always() && (failure() || cancelled()) &&
            steps.package-identity.outcome == 'success'
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-recovery-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS
            artifacts/release-recovery.bundle
            release-notes.md
          if-no-files-found: error
          retention-days: 30
